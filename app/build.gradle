apply plugin: 'com.android.application'

android {
    namespace 'com.quran.irab.robot'
    compileSdk 34

    defaultConfig {
        applicationId "com.quran.irab.robot"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // البيانات الكاملة (index.html) كبيرة نسبيًا (~19 ميغابايت)، نمنع ضغطها
    // مرة إضافية داخل الـ APK ونتركها كما هي كملف أصول.
    androidResources {
        noCompress += ['html']
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
